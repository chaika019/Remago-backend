spring:
  application:
    name: ad-crm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adcrm}
    username: ${DB_USERNAME:adcrm}
    password: ${DB_PASSWORD:adcrm}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}
          ssl:
            enable: ${MAIL_SSL_ENABLED:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_READ_TIMEOUT:30000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:30000}
        transport:
          protocol: smtp

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  placement:
    static-minimum-days: ${STATIC_PLACEMENT_MINIMUM_DAYS:28}
    static-preparation-days: ${STATIC_PLACEMENT_PREPARATION_DAYS:7}
  time-zone: ${APP_TIME_ZONE:Europe/Minsk}

  security:
    jwt-secret: ${JWT_SECRET_BASE64:VGhpcy1pcy1hLWRlbW8tc2VjcmV0LWZvci1hZC1jcm0tYmFja2VuZC0yMDI2ISE=}
    token-ttl-minutes: ${JWT_TTL_MINUTES:480}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}
    super-admin-emails: ${SUPER_ADMIN_EMAILS:egorchuiko7@gmail.com}
    super-admin-name: ${SUPER_ADMIN_NAME:Егор Чуйко}
    super-admin-initial-password: ${SUPER_ADMIN_INITIAL_PASSWORD:123123123123}
    trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
    trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:127.0.0.1,::1}
    rate-limit:
      login-attempts: ${RATE_LIMIT_LOGIN_ATTEMPTS:8}
      register-attempts: ${RATE_LIMIT_REGISTER_ATTEMPTS:4}
      code-attempts: ${RATE_LIMIT_CODE_ATTEMPTS:10}
      window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:15}
    admin-2fa:
      enabled: ${SUPER_ADMIN_2FA_ENABLED:true}
      ttl-minutes: ${SUPER_ADMIN_2FA_TTL_MINUTES:10}
      max-attempts: ${SUPER_ADMIN_2FA_MAX_ATTEMPTS:5}

  email-verification:
    enabled: ${EMAIL_VERIFICATION_ENABLED:true}
    code-ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:10}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_SECONDS:60}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}

  google-drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:false}
    service-account-json: ${GOOGLE_SERVICE_ACCOUNT_JSON:}
    root-folder-id: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:}

  notifications:
    default-channel: ${NOTIFICATION_CHANNEL:INTERNAL}

  seed:
    enabled: ${SEED_ENABLED:false}

  documents:
    storage-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
    gotenberg-url: ${GOTENBERG_URL:http://localhost:3000}
    pdf-enabled: ${PDF_ENABLED:true}

  delivery:
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    email-from: ${EMAIL_FROM:}
